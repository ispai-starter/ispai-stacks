services:
  redis:
    image: redis@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    hostname: '{{.Service.Name}}.{{.Task.Slot}}'
    command:
    - redis-server
    - --dir
    - /data
    - --appendonly
    - 'yes'
    - --maxmemory-policy
    - noeviction
    volumes:
    - /storage/redis/data:/data
    networks:
    - network_public
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
  postgres:
    image: pgvector/pgvector@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    hostname: '{{.Service.Name}}.{{.Task.Slot}}'
    environment:
    - TZ=America/Sao_Paulo
    - PGTZ=America/Sao_Paulo
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - PGDATA=/var/lib/postgresql/data/pgdata
    - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8 --data-checksums --auth-host=scram-sha-256 --auth-local=trust
    command:
    - postgres
    - --timezone=America/Sao_Paulo
    - --log_timezone=America/Sao_Paulo
    - --max_connections=200
    - --superuser_reserved_connections=3
    - --shared_buffers=512MB
    - --effective_cache_size=1GB
    - --work_mem=8MB
    - --maintenance_work_mem=128MB
    - --temp_buffers=8MB
    - --wal_buffers=16MB
    - --min_wal_size=256MB
    - --max_wal_size=1GB
    - --checkpoint_completion_target=0.9
    - --checkpoint_timeout=10min
    - --wal_compression=on
    - --wal_level=minimal
    - --max_wal_senders=0
    - --random_page_cost=1.1
    - --effective_io_concurrency=200
    - --default_statistics_target=100
    - --max_worker_processes=4
    - --max_parallel_workers=2
    - --max_parallel_workers_per_gather=1
    - --max_parallel_maintenance_workers=2
    - --autovacuum=on
    - --autovacuum_max_workers=2
    - --autovacuum_naptime=30s
    - --autovacuum_vacuum_threshold=50
    - --autovacuum_vacuum_scale_factor=0.05
    - --autovacuum_analyze_threshold=50
    - --autovacuum_analyze_scale_factor=0.05
    - --statement_timeout=120000
    - --idle_in_transaction_session_timeout=300000
    - --lock_timeout=30000
    - --log_destination=stderr
    - --logging_collector=off
    - --log_min_duration_statement=2000
    - --log_checkpoints=on
    - --log_lock_waits=on
    - --log_autovacuum_min_duration=1000
    - --shared_preload_libraries=pg_stat_statements
    - --track_activities=on
    - --track_counts=on
    - --track_io_timing=on
    volumes:
    - /storage/postgres/data:/var/lib/postgresql/data
    networks:
    - network_public
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1.5'
          memory: 2560M
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
  postgres-init:
    image: pgvector/pgvector@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
    environment:
    - PGPASSWORD=${POSTGRES_PASSWORD}
    command: "sh -c \"\n  until pg_isready -h postgres -U postgres; do sleep 2; done;\n  \n  echo '=== Criando database e user: n8n ===';\n  psql -h postgres -U postgres -tc \\\"SELECT 1 FROM pg_database WHERE datname = 'n8n'\\\" | grep -q 1 || psql -h postgres -U postgres -c 'CREATE DATABASE n8n';\n  psql -h postgres -U postgres -tc \\\"SELECT 1 FROM pg_roles WHERE rolname = 'n8n'\\\" | grep -q 1 || psql -h postgres -U postgres -c \\\"CREATE USER n8n WITH PASSWORD '${POSTGRES_PASSWORD}'\\\";\n  psql -h postgres -U postgres -c 'GRANT ALL PRIVILEGES ON DATABASE n8n TO n8n';\n  psql -h postgres -U postgres -d n8n -c 'GRANT ALL ON SCHEMA public TO n8n';\n  \n  echo '=== Habilitando extens\xF5es: n8n ===';\n  psql -h postgres -U postgres -d n8n -c 'CREATE EXTENSION IF NOT EXISTS vector';\n  psql -h postgres -U postgres -d n8n -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements';\n  \n  echo '=== Criando database: waha ===';\n  psql -h postgres -U postgres -tc \\\"SELECT 1 FROM pg_database WHERE datname = 'waha'\\\" | grep -q 1 || psql -h postgres -U postgres -c 'CREATE DATABASE waha';\n  \n  echo '=== Init conclu\xEDdo com sucesso ===';\n\"\n"
    networks:
    - network_public
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
  minio:
    image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    hostname: '{{.Service.Name}}.{{.Task.Slot}}'
    command: server /data --console-address ":9001"
    environment:
    - TZ=America/Sao_Paulo
    - MINIO_ROOT_USER=admin
    - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    - MINIO_BROWSER_REDIRECT_URL=https://cdn.${DOMAIN}
    - MINIO_SERVER_URL=https://s3.${DOMAIN}
    volumes:
    - /storage/minio/data:/data
    networks:
    - network_public
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      labels:
      - traefik.enable=true
      - traefik.swarm.network=network_public
      - traefik.http.routers.minio-s3.rule=Host(`s3.${DOMAIN}`)
      - traefik.http.routers.minio-s3.entrypoints=websecure
      - traefik.http.routers.minio-s3.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-s3.service=minio-s3
      - traefik.http.services.minio-s3.loadbalancer.server.port=9000
      - traefik.http.services.minio-s3.loadbalancer.passHostHeader=true
      - traefik.http.routers.minio-console.rule=Host(`cdn.${DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - traefik.http.services.minio-console.loadbalancer.passHostHeader=true
