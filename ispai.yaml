    - WAHA_PRESENCE_AUTO_ONLINE_DURATION_SECONDS=25
    - WHATSAPP_DEFAULT_ENGINE=GOWS
    - WAHA_LOG_FORMAT=JSON
    - WAHA_LOG_LEVEL=info
    - WAHA_HTTP_LOG_LEVEL=info
    - WAHA_PRINT_QR=False
    - WAHA_APPS_ENABLED=true
    - WAHA_APPS_ON=calls,chatwoot
    - WAHA_WORKER_ID=waha
    - WAHA_CHATWOOT_COMMAND_PREFIX=wa/
    - WAHA_CHATWOOT_MESSAGE_CALENDAR_THRESHOLD_SECONDS=600
    - WAHA_APPS_JOBS_CONCURRENCY=25
    - WAHA_APPS_JOBS_ATTEMPTS=3
    - WAHA_APPS_JOBS_DELAY=0
    - WAHA_APPS_JOBS_BACKOFF_TYPE=exponential
    - WAHA_APPS_JOBS_BACKOFF_DELAY=1000
    - WAHA_APPS_JOBS_REMOVE_ON_COMPLETE_AGE=259200
    - WAHA_APPS_JOBS_REMOVE_ON_COMPLETE_COUNT=1000
    - WAHA_APPS_JOBS_REMOVE_ON_FAIL_AGE=2678400
    - WAHA_APPS_JOBS_REMOVE_ON_FAIL_COUNT=1000
    - WAHA_MEDIA_STORAGE=LOCAL
    - WHATSAPP_FILES_FOLDER=/app/media
    - WHATSAPP_FILES_LIFETIME=86400
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
      labels:
      - traefik.enable=true
      - traefik.swarm.network=network_public
      - traefik.http.routers.waha.rule=Host(`waha.${DOMAIN}`)
      - traefik.http.routers.waha.priority=1
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=letsencrypt
      - traefik.http.routers.waha.service=waha
      - traefik.http.services.waha.loadbalancer.server.port=3000
      - traefik.http.services.waha.loadbalancer.passHostHeader=true
      - traefik.http.middlewares.waha-sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.waha.middlewares=waha-sslheader@swarm
      - traefik.http.routers.waha-hooks.rule=Host(`waha.${DOMAIN}`) && PathPrefix(`/webhooks`)
      - traefik.http.routers.waha-hooks.entrypoints=websecure
      - traefik.http.routers.waha-hooks.tls.certresolver=letsencrypt
      - traefik.http.routers.waha-hooks.priority=100
      - traefik.http.routers.waha-hooks.service=waha
      - traefik.http.middlewares.waha-hooks-deny.ipallowlist.sourcerange=127.0.0.1/32
      - traefik.http.routers.waha-hooks.middlewares=waha-hooks-deny@swarm
  chatwoot-admin:
    image: chatwoot/chatwoot@sha256:79f29e368ff49a610967dd49005b7a194ad929f8fcaa0c9177c664e07fd03eef
    hostname: '{{.Service.Name}}.{{.Task.Slot}}'
